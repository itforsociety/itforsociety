<mat-card class="body-card">
    <div class="story-container">
        <mat-card class="story-card" color="accent">
            <mat-card-header class="story-header">
            <div mat-card-avatar class="story-header-image" style="background-image: url('{{story.story_avatar}}');"></div>
            <mat-card-title>{{story.story_title}}</mat-card-title>
            <mat-card-subtitle (click)="shareFB()">{{story.story_subtitle}}</mat-card-subtitle>
            </mat-card-header>
            <div class="story-image-wrapper">
                <img class="story-image" src="{{story.story_image}}">
            </div>
            <mat-card-content class="story-content-text">
                <p *ngIf="!story.story_custom">
                  {{story.story_content}}
                </p>
                <app-story1sdg *ngIf="story.story_id == 1"></app-story1sdg>
                <app-story3sitemap *ngIf="story.story_id == 3"></app-story3sitemap>
                <p *ngIf="story.story_video_URL != 'false'">
                    <iframe width="100%" height="350" src="https://www.youtube.com/embed/FZUilc5I0lw" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button routerLink="/stories">GO BACK</button>
            </mat-card-actions>
        </mat-card>
    </div>
</mat-card>
