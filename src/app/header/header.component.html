<mat-toolbar id="header" class="header" color="primary">
    <img id="logoHeader" class="logoHeader" src="../assets/IT for society transparent inverted.png" alt="logo">
    <span class="fill-remaining-space"></span>

    <a mat-button id="matButton1" class="matButton" routerLink="/home">Home</a>
    
    <a mat-button id="matButton2" class="matButton" routerLink="/stories">Stories</a>
    
    <a mat-button id="matButton3" class="matButton" routerLink="/todo">Todo</a>
    <span class="fill-remaining-space"></span>
    
    <button mat-button id="matButton4" class="matButton" [matMenuTriggerFor]="belowMenu4">Theme</button>
    <mat-menu #belowMenu4="matMenu" yPosition="below">
        <button id="itemButton4" mat-menu-item (click)="changeTheme('my-pink-bluegrey')">pink-bluegrey</button>
        <button mat-menu-item (click)="changeTheme('my-indigo-pink')">indigo-pink</button>
    </mat-menu>
  </mat-toolbar>
