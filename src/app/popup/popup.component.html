    <mat-toolbar class="popup">
      <div id="cookiesMessage" class="pupupMessage">
        This site uses cookies from Google to deliver its services and to analyze traffic.
      </div>
      <button mat-stroked-button class="buttonPopup" (click)="removePopup()">OK</button>
      <button mat-button class="buttonPopupSecond" (click)="disableCookies()">Reject cookies</button>
      <a mat-button class="buttonPopupSecond" routerLink="/privacy">Privacy Policy</a>
    </mat-toolbar>
