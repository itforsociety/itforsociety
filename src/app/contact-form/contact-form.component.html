<mat-card class="body-card">
    
    <form class="contact-form">
        <mat-form-field class="contact-full-width">
            <mat-label>Your Email</mat-label>
            <input matInput [formControl]="emailFormControl" [errorStateMatcher]="matcher"
                    placeholder="Ex. name@contact.com">
            <mat-hint>Please input email were we can reply to your request</mat-hint>
            <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
                Please enter a valid email address
            </mat-error>
            <mat-error *ngIf="emailFormControl.hasError('required')">
                Email is <strong>required</strong>
            </mat-error>
        </mat-form-field>
        <mat-form-field class="contact-full-width" cellspacing="0">
              <mat-label>Name</mat-label>
              <input matInput>
        </mat-form-field>
        <mat-form-field  class="contact-full-width">
            <mat-label>Message</mat-label>
            <textarea matInput class="contact-message" #message maxlength="1000" placeholder="Ex. I would like to..."></textarea>
            <mat-hint align="start"><strong></strong> </mat-hint>
            <mat-hint align="end">{{message.value.length}} / 1000</mat-hint>
        </mat-form-field>
    </form>
    
</mat-card>
