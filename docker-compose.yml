version: '3.8'

services:
  app:
    build: .
    container_name: itforsociety-app
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
      - PORT=4200
    restart: unless-stopped
    networks:
      - itforsociety-network

  nginx:
    image: nginx:alpine
    container_name: itforsociety-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - itforsociety-network

  certbot:
    image: certbot/certbot
    container_name: itforsociety-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - itforsociety-network

networks:
  itforsociety-network:
    driver: bridge
