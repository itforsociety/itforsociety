<mat-card class="filters-mat-card">
  <mat-selection-list class="filters-selection-list" #days [multiple]="false" [(ngModel)]="today">
    <mat-list-option class="filters-list-option" *ngFor="let day of daysOfTheWeek"  [value]="day" >
      <p class="filters-badge-space">
        <span matBadgeColor="secondary" matBadge="4" matBadgeOverlap="false">{{day}}</span>
      </p>
    </mat-list-option>
  </mat-selection-list>
  
  <p>
    Option selected: {{today}} {{days.selectedOptions.selected[0]?.value}}
  </p>
</mat-card>
