<mat-selection-list class="filters-selection-list" #shoes [multiple]="false">
    <mat-list-option class="filters-list-option" *ngFor="let shoe of typesOfShoes" [value]="shoe" >
      <p class="filters-badge-space">
        <span matBadge="4" matBadgeOverlap="false">{{shoe}}</span>
      </p>
    </mat-list-option>
  </mat-selection-list>
  
  <p>
    Option selected: {{shoes.selectedOptions.selected[0]?.value}}
  </p>
